# Builds installers (macOS ad-hoc signed, D-114; Windows and Linux unsigned) for macOS (arm64, Intel), Windows x64 and Linux x64 (D-113).
# Run by hand (workflow_dispatch) for a test build, or push a v* tag for a draft GitHub Release.
# No secrets: nothing is signed and nothing is published automatically.
name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs-only pushes do not build. Path filters are not applied to tag pushes.
    paths:
      - "core/**"
      - "sidecar/**"
      - "app/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"
    tags: ["v*"]

# A newer push on the same branch cancels the older run. Tag runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-latest, llama: macos-arm64, flags: "--mac --arm64" }
          - { name: macos-x64, runner: macos-15-intel, llama: macos-x64, flags: "--mac --x64" }
          - { name: windows-x64, runner: windows-latest, llama: win-cpu-x64, flags: "--win --x64" }
          - { name: linux-x64, runner: ubuntu-latest, llama: ubuntu-x64, flags: "--linux --x64" }
    defaults:
      run:
        shell: bash
    env:
      # Windows Python defaults to cp1252; third_party_notices.py reads and writes license text without an encoding.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python deps
        run: uv sync --frozen
      - name: Freeze the sidecar
        run: uv run pyinstaller packaging/sidecar.spec --noconfirm --distpath packaging/build/sidecar --workpath build/pyi
      - name: Fetch llama-server (pinned, SHA-256 checked)
        run: uv run python packaging/fetch_llama.py --target ${{ matrix.llama }}
      - name: Third-party notices
        run: |
          (cd app && npm ci)
          uv run python packaging/third_party_notices.py
      - name: Build the installer
        working-directory: app
        run: npm run dist -- ${{ matrix.flags }}
      - name: Check the macOS signature (D-114)
        if: startsWith(matrix.name, 'macos')
        working-directory: app/release
        run: codesign --verify --deep --strict --verbose=2 mac*/Shiori.app
      - name: SHA-256 file
        working-directory: app/release
        run: |
          uv run --project "$GITHUB_WORKSPACE" python - <<'PY'
          import glob, hashlib
          files = sorted(f for ext in ("dmg", "exe", "AppImage") for f in glob.glob(f"Shiori-*.{ext}"))
          assert files, "no installer found"
          with open("SHA256SUMS-${{ matrix.name }}.txt", "w") as out:
              for f in files:
                  out.write(f"{hashlib.sha256(open(f, 'rb').read()).hexdigest()}  {f}\n")
          PY
          cat SHA256SUMS-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shiori-${{ matrix.name }}
          if-no-files-found: error
          # 14 days for branch builds; 0 means the repository default, used for tag builds.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 0 || 14 }}
          path: |
            app/release/Shiori-*.dmg
            app/release/Shiori-*.exe
            app/release/Shiori-*.AppImage
            app/release/SHA256SUMS-*.txt

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # for docs/release_notes_<tag>.md
        with:
          sparse-checkout: docs
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" out/* --draft --title "${{ github.ref_name }}" --notes-file "docs/release_notes_${{ github.ref_name }}.md"
